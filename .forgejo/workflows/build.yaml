on: [push]

jobs:
  build:
    runs-on: docker
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v3
      - run: dnf install -y hugo
      - run: hugo
      - name: Deploy to uber.space
        run: |
          dnf install -y openssh-clients rsync
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan marian.uber.space >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" public/ marian@marian.uber.space:/