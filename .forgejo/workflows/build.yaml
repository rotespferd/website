on: [push]

jobs:
  build:
    runs-on: docker
    steps:
      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y git-lfs rsync
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          lfs: true
      - name: Install Hugo
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep -oP '"tag_name": "\K[^"]+' | sed 's/v//')
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz hugo
          mv hugo /usr/local/bin/
      - run: hugo
      - name: Deploy to uber.space
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan marian.uber.space >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" public/ marian@marian.uber.space:
